ReleaseNotes: |-
  ✨ New Features
  - Introducing Keyless wallet with social login
  - Added support for Stellar (XLM)
  - Earn now includes Kamino supply & borrow
  - Native token trading now available in Market
  - Referral notifications for hardware sales and reward payouts
  - Best price option for Perps limit orders
  - Favorites feature in Perps
  - Position and liquidation lines on Perps charts
  - Standalone volume indicator on Perps mobile
  💎 Improvements
  - Smoother referral invitation flow
  - High/low price markers on Market charts
  - Spam transactions now covered by "Hide risky transactions" toggle
  - Redesigned hardware device management with quick settings access
  - Refreshed Web navigation bar and More menu
  - Swap Pro Mode now prompts address creation when needed
  - Limit orders in Swap Pro Mode now support USDT/USDC toggle when selling
  - Improved sticky header behavior in Discover Market list
  - Smoother swipe gestures for tab switching in Discover
  - Faster asset sync under All Networks
  🐞 Bug Fixes
  - Fixed private key accounts showing as unsupported in All Networks
  - Fixed desktop full update failure
  - Fixed network fee not updating when revoking approvals individually
  - Fixed chart gaps in Perps after screen lock
  - Fixed delayed network status on Perps mobile
  - Fixed positions not refreshing in Perps after switching views
  - Fixed error when using full balance for Perps limit orders
  - Fixed long token names not truncating in Market
  ✨ 新功能
  - 新增 Keyless 钱包，支持社交登录创建钱包
  - 新增 Stellar (XLM) 链支持
  - Earn 新增 Kamino supply/borrow
  - Market 支持主币交易
  - 返佣新增硬件销售和奖励发放通知
  - Perps 限价单新增最优价功能
  - Perps 新增收藏功能
  - Perps K 线图新增持仓线和爆仓线显示
  - Perps 移动端成交量指标支持独立显示
  💎 改进
  - 优化返佣邀请跳转流程
  - Market K 线新增最高点和最低点标注
  - Spam 风险交易纳入「隐藏风险交易」开关管控
  - 硬件设备管理页面改版，新增设置入口
  - Web 端导航栏和 More 菜单优化
  - Swap Pro Mode 未创建地址时提示创建
  - Swap Pro Mode 限价单卖出时可切换 USDT/USDC
  - 发现页 Market 列表吸顶位置优化
  - 发现页滑动切换 Tab 手势优化
  - 优化 All Networks 下资产更新机制
  🐞 问题修复
  - 修复私钥账户在所有网络提示不支持的问题
  - 修复桌面端全量更新失败的问题
  - 修复逐一撤销授权时网络费用未正确切换的问题
  - 修复 Perps 锁屏后 K 线出现断层的问题
  - 修复 Perps 移动端断网状态不及时的问题
  - 修复 Perps 切换界面后持仓没更新的问题
  - 修复 Perps 限价单使用全部金额下单报错的问题
  - 修复 Market 代币名称过长显示没截断的问题
