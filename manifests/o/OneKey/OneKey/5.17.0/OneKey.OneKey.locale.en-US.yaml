ReleaseNotes: |-
  ✨ New Features
  - Referral program now supports creating multiple referral codes
  - Added support for the Bifrost Polkadot network
  - Added iCloud and Google Drive backup support
  - Added Solana transaction simulation
  - Added Near Intents integration for Swap
  - Added Perps share card generation and social sharing
  💎 Improvements
  - Improved Swap & Bridge order list display
  - Improved Swap user experience
  - Improved Onboarding user experience
  🐞 Bug Fixes
  - Fixed Perps market data not updating after switching accounts or tokens
  - Fixed Perps chart not refreshing after switching tokens
  - Fixed white screen when exiting the transfer page too quickly
  - Fixed Classic 1s failing to send TON or execute TON Swap
  - Fixed INVALID BIP44 error when transferring LTC using private key accounts
  - Fixed blank network selector in some DApps
  - Fixed search bar not overriding text after selecting all
  - Fixed DOT private-key account icon display issue
  - Fixed inconsistent tab name and URL rollback when visiting Aave
  - Fixed white screen when clearing current browser tab
  - Fixed missing overlay when triggering multiple popups using shortcuts
  ✨ 新功能
  - 返佣支持创建多个邀请码
  - 新增 Bifrost Polkadot 网络支持
  - 支持 iCloud 与 Google Drive 云备份
  - Solana 交易支持模拟执行
  - Swap 接入 Near Intents 渠道
  - Perps 支持生成分享卡片并分享到社交平台
  💎 改进
  - 优化 Swap & Bridge 订单列表展示
  - 优化 Swap 用户体验
  - 优化 Onboarding 用户体验
  🐞 问题修复
  - 修复 Perps 切换账户或币种后行情数据未及时更新的问题
  - 修复 Perps 切换代币后点击刷新图表未更新的问题
  - 修复快速退出传输页面可能出现白屏的问题
  - 修复 Classic 1s 在 TON 链发送主币、代币或进行 TON Swap 失败的问题
  - 修复 LTC 私钥账户转账出现 INVALID BIP44 错误的问题
  - 修复部分 DApp 中网络选择器显示为空白的问题
  - 修复网络选择器搜索全选后输入内容未正确覆盖的问题
  - 修复通用搜索中 DOT 私钥账户图标显示异常的问题
  - 修复访问 Aave 时标签页名称不一致与 URL 回滚的问题
  - 修复浏览器当前标签页清除后出现白屏的问题
  - 修复使用快捷键连续唤起多个弹窗导致蒙层消失的问题
