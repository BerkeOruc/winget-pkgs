ReleaseNotes: |-
  What’s New in Legcord v1.2.0 ✨
  Highlights & Improvements
  - 🎮 Brand-new game detection system
    Completely reworked for reliability across platforms — now detects games smoothly and consistently.
  - 🧪 Legcord Games (Beta)
    Add your own custom games/detectables and have Legcord RPC automatically detect them while running.
  - 🎨 Improved Vencord Quick CSS patch
    Now properly shows an import dialog for adding custom CSS.
  - 🌍 Localization improvements
    Added missing i18n strings and revamped translations.
  - 📺 Stream quality patch updated
    Updated to stay compatible with recent Discord changes.
  - ⬇️ Fixed the “Download Apps” button incorrectly appearing.
  - 🪟 macOS & Windows titlebar styling fixes.
  - 🧩 Extended plugin abilities (optional)
    When enabled, allows plugins to save files locally (e.g. caching deleted messages). Disabled by default for safety.
  - 🎨 Numerous style updates to match Discord’s settings revamp and rebrand.
  - 🎛️ Improved Touch Bar handling on macOS.
  - ⚡ Settings are now cached, improving overall performance.
  - 🔗 Discord deeplinks support (discord://)
    Invites and other protocol-based integrations now open correctly.
  Fixes & Community Contributions
  - 🧯 Fixed arRPC crashing (#949 by @PONYMODZ)
  - ▶️ Fixed YouTube adblock issues (#979 by @Alangopro)
  - 📖 Updated README with Debian installation instructions (#972 by @khancyr)
  - 🧭 Fixed Equicord headerbar button overlap (#990 by @lbrooney)
  - 🎨 Updated CSS variable names used on navigation buttons (#989 by @lbrooney)
  - 📐 Fixed trailing bar collision with the navigation bar (#993 by @lbrooney)
  - 📺 Fixed YouTube embeds in chat and Watch Together activity (#994 by @MahmodZE)
  - 🧩 Refactored and redesigned several UI components (#995 by @MahmodZE)
  - ⌨️ Improved the keybind maker (#996 by @MahmodZE)
  - 🚀 Fixed a launch failure related to global shortcuts (#1004 by @MahmodZE)
  - 🖥️ Fixed an issue where the screenshare picker modal closes on click-outside and wouldn’t reopen (#1002 by @MahmodZE)
  New Contributors 👋
  - @Alangopro – first contribution in [#979](#979)
  - @khancyr – first contribution in [#972](#972)
  - @MahmodZE – first contribution in [#994](#994)
  Special Thanks ❤️
  Big shoutout to @FlintSH and @fluffypony for their generous donations!
  👉 Full Changelog: v1.1.6...v1.2.0
