ReleaseNotes: |-
  What’s New in Legcord v1.2.2 ✨
  Improvements & Fixes
  - 🚫 Game blacklist for arRPC detection
    You can now exclude specific games/apps from being picked up by our rich presence implementation.
  - ⚡ Electron updated for better stability and compatibility.
  - 🎨 Quick CSS toggle added.
  - 🪟 Fixed Windows titlebar duplication (#1009 by @passionvine).
  - 🧪 Custom Chromium flags support
    Use your own Chromium flags on top of Legcord’s presets (#1016 by @Dark-Matter7232).
  - 🛠️ Fixed settings menu version patch (#1014 by @MahmodZE).
  - 🧹 Fixed various build warnings (#1017 by @MahmodZE).
  New Contributors 👋
  - @passionvine – first contribution (#1009)
  - @Dark-Matter7232 – first contribution (#1016)
  Special Thanks ❤️
  Big shoutout to @FlintSH and @fluffypony for their generous donations!
